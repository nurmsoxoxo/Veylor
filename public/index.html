<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Veylo</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png">
<meta name="theme-color" content="#080F24">
<style>
:root{--bg:#080F24;--bg2:#111C35;--p:#315BEA;--a:#6385FF;--t:#F5F7FF;--t2:#A0ADC5;--b:#25324D;--ok:#35C991;--bad:#ff6b7a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3{font-family:Alfredo,"Iowan Old Style",Georgia,serif;font-weight:600;margin:0}
#app{max-width:480px;margin:0 auto;min-height:100vh;padding:96px 18px 110px}
.card{background:var(--bg2);border:1px solid var(--b);border-radius:18px;padding:16px;margin:12px 0}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:13px 18px;background:var(--p);color:#fff;transition:transform .1s,background .2s}
button:active{transform:scale(.97)}button:hover{background:var(--a)}
button.g{background:transparent;border:1px solid var(--b);color:var(--t)}button.g:hover{background:var(--bg2)}
button.sm{padding:8px 12px;font-size:14px}button.w{width:100%}
input,textarea,select{width:100%;font:inherit;background:var(--bg);color:var(--t);border:1px solid var(--b);border-radius:12px;padding:12px;margin:6px 0 10px}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:2px solid var(--a);outline-offset:2px}
label{color:var(--t2);font-size:14px}.mut{color:var(--t2);font-size:14px}.row{display:flex;gap:8px;align-items:center}.sp{justify-content:space-between}
nav{position:fixed;left:0;right:0;top:0;z-index:5;background:var(--bg2);border-bottom:1px solid var(--b);padding-top:env(safe-area-inset-top,0px)}
nav div{max-width:480px;margin:0 auto;display:flex}nav button{flex:1;background:none;border-radius:0;color:var(--t2);padding:12px 0;font-size:13px}
nav button.on{color:var(--t);box-shadow:inset 0 -2px 0 var(--a)}
.badge{background:var(--p);border-radius:99px;padding:1px 8px;font-size:12px}
.sms{background:#fff;color:#111;border-radius:16px;padding:14px;font-size:14px;white-space:pre-wrap}
.warn{border-left:3px solid #e8b44a;background:#1d2336;padding:10px 12px;border-radius:8px;font-size:14px;color:var(--t2)}
.bub{max-width:80%;padding:9px 13px;border-radius:16px;margin:5px 0;animation:in .2s}.me{background:var(--p);margin-left:auto}.th{background:var(--bg2);border:1px solid var(--b)}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
#toast{position:fixed;top:calc(96px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--bg2);border:1px solid var(--b);border-radius:12px;padding:10px 16px;z-index:9;max-width:90%}
.splash{display:grid;place-items:center;min-height:70vh;text-align:center}.logo{animation:pop 1s ease both}@keyframes pop{from{opacity:0;transform:scale(.8)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.st{font-size:12px;opacity:.75;margin-top:3px}</style></head><body>
<div id="app"></div><div id="toast" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const sb=supabase.createClient("https://xtdidexbrgwkhczokhen.supabase.co","sb_publishable_jHOE5k40j8OZYXFdHzhEyA_unXKJBhK");
const LOGO=(s=64)=>`<img src="/icons/icon-192.png" width="${s}" height="${s}" alt="Veylo" style="border-radius:22%">`;
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fe=m=>/invalid login/i.test(m)?'Wrong email or password. Tap Forgot password to reset it.':/not confirmed/i.test(m)?'Email not confirmed yet. Confirm it from your inbox.':/rate limit|too many|security purposes/i.test(m)?'Too many emails sent recently. Wait a while before asking for another.':m;
function toast(m,bad){const t=$('#toast');t.textContent=bad?fe(m):m;t.style.borderColor=bad?'var(--bad)':'var(--ok)';t.hidden=false;clearTimeout(t._);t._=setTimeout(()=>t.hidden=true,7000)}
const FOOT="\n\nSent anonymously via Veylo. Reply STOP to opt out.";
const S={user:null,view:'welcome',msgs:[],open:null,prefill:'',sending:false,ch:null};
const mask=p=>p.slice(0,3)+' ••• '+p.slice(-3);
const ago=d=>new Date(d).toLocaleString([],{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
function go(v){S.view=v;S.open=null;render()}
function render(){const a=$('#app');a.innerHTML=(V[S.view]||V.welcome)();if(S.user&&['send','msgs','admin','acct'].includes(S.view))a.innerHTML+=nav();bind()}
function nav(){const it=[['send','Send','➤'],['msgs','Messages','💬']].concat(S.user.role==='admin'?[['admin','Admin','★']]:[]).concat([['acct','Account','☺']]);return`<nav><div>${it.map(([k,l,i])=>`<button class="${S.view===k?'on':''}" data-go="${k}">${i}<br>${l}</button>`).join('')}</div></nav>`}
const V={
welcome:()=>`<div class="splash"><div><div class="logo">${LOGO(96)}</div><h1 style="font-size:44px;margin-top:10px;letter-spacing:.04em">Veylo</h1><p style="font-size:20px;font-family:Georgia,serif">Say what you feel. Stay unknown.</p><p class="mut">Send an anonymous text to a phone number. They can reply by SMS.</p><button class="w" data-go="register">Get started</button><br><br><button class="w g" data-go="login">Log in</button></div></div>`,
register:()=>`<h2>Create your account</h2><p class="mut">Veylo is for adults aged 18+. New accounts need admin approval before they can send.</p><form id="reg"><label>Username<input name="u" required minlength="3" maxlength="20" pattern="[a-zA-Z0-9_]+"></label><label>Email<input name="e" type="email" required autocomplete="email"></label><label>Password<input name="p" type="password" required minlength="10" autocomplete="new-password"></label><label>Confirm password<input name="p2" type="password" required autocomplete="new-password"></label><label>Date of birth<input name="d" type="date" required></label><label class="row"><input type="checkbox" name="t" required style="width:auto"> I accept the Terms and Privacy Policy</label><button class="w">Create account</button></form><p class="mut">Already registered? <a href="#" data-go="login" style="color:var(--a)">Log in</a></p>`,
login:()=>`<h2>Welcome back</h2><form id="log"><label>Email<input name="u" type="email" required autocomplete="email" inputmode="email"></label><label>Password<input name="p" type="password" required autocomplete="current-password"></label><label class="row"><input type="checkbox" style="width:auto" onchange="this.form.p.type=this.checked?'text':'password'"> Show password</label><button class="w">Log in</button><br><br><button type="button" class="w g" id="magic">Email me a login link instead</button></form><p class="mut" style="text-align:center">Build 6</p><p class="mut"><a href="#" data-go="register" style="color:var(--a)">Create account</a> · <a href="#" id="forgot" style="color:var(--a)">Forgot password?</a></p>`,
newpw:()=>`<h2>Set a new password</h2><form id="npw"><label>New password<input name="p" type="password" required minlength="10" autocomplete="new-password"></label><button class="w">Save password</button></form>`,
send:()=>{const ok=S.user.can_send||S.user.role==='admin';return`<h2>Send anonymous SMS</h2>${ok?'':'<div class="warn">Your account is waiting for admin approval before it can send.</div>'}<form id="snd"><label>Phone number, with country code<input name="n" inputmode="tel" required placeholder="+44 7700 900123" value="${esc(S.prefill)}" autocomplete="off"></label><label>Your message<textarea name="m" id="msg" rows="4" maxlength="320" required></textarea></label><div class="mut" id="cnt"></div><h3 style="margin-top:12px">What they will receive</h3><div class="sms" id="prev"></div><br><button class="w" id="sb">Send anonymously</button></form><p class="mut">Nigerian (+234) numbers are not supported. Your number and name are never shown to the recipient.</p>`},
msgs:()=>{if(S.open){const t=S.msgs.filter(m=>m.to_phone===S.open);return`<button class="g sm" data-go="msgs">← Back</button><h3 style="margin-top:12px">${mask(S.open)}</h3>${t.map(m=>`<div class="bub ${m.direction==='out'?'me':'th'}">${esc(m.body)}<div class="st">${m.direction==='out'?esc(m.status)+(m.error?' · '+esc(m.error):''):'reply'} · ${ago(m.created_at)}</div></div>`).join('')}<br><button class="sm" id="again">Send another message</button>`}
const g={};S.msgs.forEach(m=>(g[m.to_phone]=g[m.to_phone]||[]).push(m));const k=Object.keys(g).sort((a,b)=>g[b].at(-1).created_at.localeCompare(g[a].at(-1).created_at));
return`<h2>Messages</h2>${k.length?k.map(p=>{const l=g[p].at(-1),r=g[p].filter(m=>m.direction==='in').length;return`<div class="card" data-t="${p}" style="cursor:pointer"><div class="row sp"><b>${mask(p)}</b><span class="mut">${ago(l.created_at)}</span></div><div class="mut">${esc(l.body.slice(0,70))}</div><span class="st">${l.direction==='out'?esc(l.status):'reply'}</span> ${r?`<span class="badge">${r} repl${r>1?'ies':'y'}</span>`:''}</div>`}).join(''):`<div class="card" style="text-align:center"><h3>No messages yet.</h3><p class="mut">Send your first anonymous text and replies will appear here.</p></div>`}`},
admin:()=>`<h2>Admin</h2><p class="mut">Approve accounts that may send SMS.</p><div id="adm" class="mut">Loading…</div>`,
acct:()=>`<div class="card" style="text-align:center">${LOGO(56)}<h2>${esc(S.user.name)}</h2><div class="mut">Veylo ID: ${S.user.vid} ${S.user.role==='admin'?'<span class="badge">admin</span>':''}</div><div class="mut">Member since ${S.user.since}</div></div><form id="pf"><label>Display username<input name="u" value="${esc(S.user.name)}" minlength="3" maxlength="20" pattern="[a-zA-Z0-9_]+"></label><button class="w">Save username</button></form><br><button class="w g" id="out">Log out</button><br><br><button class="w" id="delacct" style="background:var(--bad)">Delete account</button>`};
async function loadProfile(u){const{data,error}=await sb.from('profiles').select('username,veylo_id,role,can_send,created_at').eq('id',u.id).single();if(error){toast('Could not load profile: '+error.message,1);return false}S.user={id:u.id,name:data.username,vid:data.veylo_id,role:data.role,can_send:data.can_send,since:new Date(data.created_at).toLocaleDateString()};return true}
async function loadMsgs(){const{data,error}=await sb.from('sms_messages').select('*').order('created_at');if(error)return;S.msgs=data;if(S.view==='msgs')render()}
function live(){if(S.ch)return;S.ch=sb.channel('sms').on('postgres_changes',{event:'*',schema:'public',table:'sms_messages'},()=>loadMsgs()).subscribe()}
async function enter(){await loadMsgs();live();go('send')}
async function loadAdmin(){const el=$('#adm');if(!el)return;const{data,error}=await sb.from('profiles').select('id,username,role,can_send').order('created_at',{ascending:false}).limit(100);if(error)return el.textContent='Error: '+error.message;el.innerHTML=data.map(u=>`<div class="card row sp"><div><b>${esc(u.username)}</b><div class="mut">${u.role}</div></div>${u.role==='admin'?'<span class="badge">admin</span>':`<button class="sm ${u.can_send?'g':''}" data-sw="${u.id}" data-v="${u.can_send}">${u.can_send?'Revoke':'Approve'}</button>`}</div>`).join('');el.querySelectorAll('[data-sw]').forEach(b=>b.onclick=async()=>{const{error}=await sb.from('profiles').update({can_send:b.dataset.v!=='true'}).eq('id',b.dataset.sw);if(error)return toast(error.message,1);loadAdmin()})}
function bind(){if(S.view==='admin')loadAdmin();
document.querySelectorAll('[data-go]').forEach(e=>e.onclick=ev=>{ev.preventDefault();go(e.dataset.go)});
document.querySelectorAll('[data-t]').forEach(e=>e.onclick=()=>{S.open=e.dataset.t;render()});
const f=(id,fn)=>{const e=$(id);if(e)e.onsubmit=ev=>{ev.preventDefault();fn(Object.fromEntries(new FormData(e)))}},c=(id,fn)=>{const e=$(id);if(e)e.onclick=fn};
const mg=$('#msg');if(mg){const up=()=>{const v=mg.value,tot=(v+FOOT).length,sg=tot<=160?1:Math.ceil(tot/153);$('#cnt').textContent=`${v.length} / 320 characters · about ${sg} SMS segment(s)`;$('#prev').textContent=v+FOOT};mg.oninput=up;up()}
f('#snd',async d=>{if(S.sending)return;let n=d.n.replace(/[\s\-().]/g,'');if(n.startsWith('00'))n='+'+n.slice(2);if(!/^\+[1-9]\d{6,14}$/.test(n))return toast('Enter the number with country code, like +44 7700 900123.',1);if(n.startsWith('+234'))return toast('Nigerian numbers (+234) are not supported.',1);const b=$('#sb');S.sending=true;b.disabled=true;b.textContent='Sending…';const{data,error}=await sb.functions.invoke('send-sms',{body:{to:n,message:d.m.trim()}});S.sending=false;let m=null;if(error){m='SMS service is not set up yet.';try{const j=await error.context.json();m=j.error||m}catch(e){}}else if(data&&data.error)m=data.error;if(m){b.disabled=false;b.textContent='Send anonymously';return toast(m,1)}S.prefill='';toast('Handed to the SMS provider. Check Messages for delivery status.');await loadMsgs();go('msgs')});
c('#again',()=>{S.prefill=S.open;go('send')});
f('#reg',async d=>{if(d.p!==d.p2)return toast('Passwords do not match.',1);const age=(Date.now()-new Date(d.d))/31557600000;if(!(age>=18))return toast('You must be 18 or older.',1);const{data,error}=await sb.auth.signUp({email:d.e,password:d.p,options:{emailRedirectTo:location.origin,data:{username:d.u,birth_date:d.d}}});if(error)return toast(error.message,1);let u=data.user;if(!data.session){const r=await sb.auth.signInWithPassword({email:d.e,password:d.p});if(r.error){toast('Account created, but email confirmation is still required. Turn off "Confirm email" in Supabase, or confirm from your inbox.',1);return go('login')}u=r.data.user}if(u&&await loadProfile(u)){toast('Welcome to Veylo!');enter()}});
f('#log',async d=>{const{data,error}=await sb.auth.signInWithPassword({email:d.u,password:d.p});if(error)return toast(error.message,1);if(await loadProfile(data.user))enter()});
c('#magic',async()=>{const em=document.querySelector('#log [name=u]').value.trim();if(!em)return toast('Enter your email first.',1);const{error}=await sb.auth.signInWithOtp({email:em,options:{emailRedirectTo:location.origin,shouldCreateUser:false}});toast(error?error.message:'Login link sent. Open it on this device.',!!error)});
f('#npw',async d=>{const{error}=await sb.auth.updateUser({password:d.p});if(error)return toast(error.message,1);const{data}=await sb.auth.getUser();toast('Password saved.');if(data.user&&await loadProfile(data.user))enter()});
c('#forgot',async e=>{e.preventDefault();const em=prompt('Your account email');if(!em)return;const{error}=await sb.auth.resetPasswordForEmail(em,{redirectTo:location.origin});toast(error?error.message:'If that email has an account, a reset link was sent.',!!error)});
f('#pf',async d=>{const{error}=await sb.from('profiles').update({username:d.u}).eq('id',S.user.id);if(error)return toast(error.message.includes('duplicate')?'That username is taken.':error.message,1);S.user.name=d.u;toast('Username saved.');render()});
const clear=()=>{sb.removeAllChannels();Object.assign(S,{user:null,msgs:[],ch:null,open:null})};
c('#out',async()=>{await sb.auth.signOut();clear();go('welcome')});
c('#delacct',async()=>{if(!confirm('Delete your account and all messages permanently?'))return;const{error}=await sb.rpc('delete_my_account');if(error)return toast(error.message,1);await sb.auth.signOut();clear();go('welcome')})}
render();{const hp=new URLSearchParams(location.hash.slice(1));if(hp.get('error_description')){toast(hp.get('error_description').replace(/\+/g,' '),1);history.replaceState(null,'',location.pathname)}}
sb.auth.onAuthStateChange((ev,sess)=>{setTimeout(async()=>{if(ev==='PASSWORD_RECOVERY'){S.view='newpw';render()}else if((ev==='INITIAL_SESSION'||ev==='SIGNED_IN')&&sess&&!S.user&&S.view!=='newpw'){if(await loadProfile(sess.user))enter()}},0)});
</script></body></html>
